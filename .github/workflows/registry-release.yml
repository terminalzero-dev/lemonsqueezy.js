name: Registry Release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release Candidate workflow run ID
        required: true
        type: string
      expected_version:
        description: Exact package version to publish through Trusted Publishing
        required: true
        type: string
      expected_commit:
        description: Full protected-branch Candidate commit SHA
        required: true
        type: string
      expected_sha256:
        description: Canonical Package Artifact SHA-256
        required: true
        type: string
      last_known_good_version:
        description: Verified Last Known Good version for the rollback drill
        required: true
        type: string
      resume_published:
        description: Resume only when the exact Candidate bytes are already in npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: v5-release
  cancel-in-progress: false

jobs:
  stage:
    name: Stage the exact Candidate for publication
    if: >-
      github.actor == vars.RELEASE_MAINTAINER &&
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/release/v5-beta')
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the protected Candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_commit }}

      - name: Verify protected dispatch identity
        run: |
          test "$EXPECTED_COMMIT" = "$DISPATCH_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
        env:
          DISPATCH_COMMIT: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable the repository package manager
        run: corepack enable

      - name: Download the completed Candidate without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ inputs.expected_version }}-${{ inputs.expected_commit }}
          path: .artifacts/package
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Recheck Candidate bytes and the declared registry state
        run: >-
          node scripts/verify-release-candidate.mjs
          --expected-version "$EXPECTED_VERSION"
          --expected-commit "$EXPECTED_COMMIT"
          --expected-sha256 "$EXPECTED_SHA256"
          --registry-state "$REGISTRY_STATE"
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          REGISTRY_STATE: ${{ inputs.resume_published && 'matching' || 'absent' }}

      - name: Stage the verified Candidate inside this workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-release-staged-${{ inputs.expected_version }}-${{ inputs.expected_sha256 }}
          path: .artifacts/package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the exact Candidate through OIDC
    needs: stage
    if: >-
      github.actor == vars.RELEASE_MAINTAINER &&
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/release/v5-beta')
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the protected Candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_commit }}

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable the repository package manager
        run: corepack enable

      - name: Download the staged Candidate without cross-run authority
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-release-staged-${{ inputs.expected_version }}-${{ inputs.expected_sha256 }}
          path: .artifacts/package

      - name: Prove OIDC dist-tag recovery authority
        run: >-
          node scripts/exercise-dist-tags.mjs probe
          --package "@terminalzero/lemonsqueezy"
          --current-version "$EXPECTED_VERSION"
          --last-known-good-version "$LAST_KNOWN_GOOD_VERSION"
          --evidence .artifacts/package/dist-tag-auth-probe-evidence.json
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          LAST_KNOWN_GOOD_VERSION: ${{ inputs.last_known_good_version }}

      - name: Publish the unchanged tarball with explicit beta and provenance
        if: inputs.resume_published != true
        run: |
          tarballs=(.artifacts/package/packages/*.tgz)
          test "${#tarballs[@]}" -eq 1
          tarball=${tarballs[0]}
          pnpm publish "$tarball" --tag beta --access public --provenance --no-git-checks

      - name: Preserve the published Candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-release-published-${{ inputs.expected_version }}-${{ inputs.expected_sha256 }}
          path: .artifacts/package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  promote:
    name: Promote both recommended dist-tags
    needs: publish
    if: >-
      github.actor == vars.RELEASE_MAINTAINER &&
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/release/v5-beta')
    environment: npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_commit }}

      - name: Download the published Candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-release-published-${{ inputs.expected_version }}-${{ inputs.expected_sha256 }}
          path: .artifacts/package

      - name: Move latest to the new Last Known Good through OIDC
        run: >-
          node scripts/exercise-dist-tags.mjs promote
          --package "@terminalzero/lemonsqueezy"
          --current-version "$EXPECTED_VERSION"
          --last-known-good-version "$LAST_KNOWN_GOOD_VERSION"
          --evidence .artifacts/package/dist-tag-promotion-evidence.json
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          LAST_KNOWN_GOOD_VERSION: ${{ inputs.last_known_good_version }}

      - name: Preserve promoted tag evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-release-promoted-${{ inputs.expected_version }}-${{ inputs.expected_sha256 }}
          path: .artifacts/package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify registry bytes, provenance, tags, and consumer behavior
    needs: promote
    if: >-
      github.actor == vars.RELEASE_MAINTAINER &&
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/release/v5-beta')
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_commit }}

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable the repository package manager
        run: corepack enable

      - name: Download the promoted Candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-release-promoted-${{ inputs.expected_version }}-${{ inputs.expected_sha256 }}
          path: .artifacts/package

      - name: Install the exact registry version and exercise ESM and CJS
        run: pnpm test:package
        env:
          PACKAGE_SMOKE_SPEC: "${{ inputs.expected_version }}"
          PACKAGE_SMOKE_EXPECTED_VERSION: ${{ inputs.expected_version }}
          PACKAGE_SMOKE_RUNTIME: node

      - name: Verify registry signature and provenance with npm
        run: |
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"
          audit_directory=$(mktemp -d)
          cd "$audit_directory"
          npm init --yes
          npm install --ignore-scripts --save-exact "$PACKAGE_NAME@$EXPECTED_VERSION"
          npm audit signatures --json --include-attestations \
            > "$GITHUB_WORKSPACE/.artifacts/package/provenance-audit.json"
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          PACKAGE_NAME: "@terminalzero/lemonsqueezy"

      - name: Bind registry metadata, bytes, provenance, and tags to the Candidate
        run: >-
          node scripts/verify-registry-release.mjs
          --expected-version "$EXPECTED_VERSION"
          --expected-commit "$EXPECTED_COMMIT"
          --expected-sha256 "$EXPECTED_SHA256"
          --expected-run-id "$CANDIDATE_RUN_ID"
          --repository "$GITHUB_REPOSITORY"
          --provenance-evidence .artifacts/package/provenance-audit.json
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Preserve verified registry evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-release-verified-${{ inputs.expected_version }}-${{ inputs.expected_sha256 }}
          path: .artifacts/package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  rollback:
    name: Exercise and restore the Last Known Good rollback
    needs: verify
    if: >-
      github.actor == vars.RELEASE_MAINTAINER &&
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/release/v5-beta')
    environment: npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact rollback tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_commit }}

      - name: Download the verified registry bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-release-verified-${{ inputs.expected_version }}-${{ inputs.expected_sha256 }}
          path: .artifacts/package

      - name: Move both tags back to beta.1 and restore beta.2 through OIDC
        run: >-
          node scripts/exercise-dist-tags.mjs rollback
          --package "@terminalzero/lemonsqueezy"
          --current-version "$EXPECTED_VERSION"
          --last-known-good-version "$LAST_KNOWN_GOOD_VERSION"
          --evidence .artifacts/package/dist-tag-rollback-evidence.json
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          LAST_KNOWN_GOOD_VERSION: ${{ inputs.last_known_good_version }}

      - name: Preserve the complete release and rollback evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-release-evidence-${{ inputs.expected_version }}-${{ inputs.expected_sha256 }}
          path: .artifacts/package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  tag:
    name: Create or verify the protected release tag
    needs: rollback
    if: >-
      github.actor == vars.RELEASE_MAINTAINER &&
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/release/v5-beta')
    environment: npm-release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release identity verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint the installation-audit identity
        id: audit-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read

      - name: Verify the complete release App installation boundary
        run: >-
          node scripts/verify-release-installation.mjs
          --repository "$GITHUB_REPOSITORY"
          --installation-id "$INSTALLATION_ID"
          --app-slug "$APP_SLUG"
        env:
          APP_SLUG: ${{ steps.audit-token.outputs.app-slug }}
          GITHUB_TOKEN: ${{ steps.audit-token.outputs.token }}
          INSTALLATION_ID: ${{ steps.audit-token.outputs.installation-id }}
          RELEASE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}

      - name: Mint the repository-only release identity
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout with the repository-only release identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true
          ref: ${{ inputs.expected_commit }}
          token: ${{ steps.release-token.outputs.token }}

      - name: Create or verify the protected release tag
        run: |
          tag="v${EXPECTED_VERSION}"
          tag_ref=
          if existing_tag_ref=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null); then
            tag_ref=$existing_tag_ref
          fi
          if test -z "$tag_ref"; then
            git tag "$tag" "$EXPECTED_COMMIT"
            git push origin "refs/tags/$tag:refs/tags/$tag"
            tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")
          fi
          test -n "$tag_ref"
          tag_sha=$(printf '%s' "$tag_ref" | jq -r .object.sha)
          tag_type=$(printf '%s' "$tag_ref" | jq -r .object.type)
          if test "$tag_type" = "tag"; then
            tag_sha=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
              --jq .object.sha)
          fi
          test "$tag_sha" = "$EXPECTED_COMMIT"
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}

  finalize:
    name: Publish the immutable prerelease
    needs: tag
    if: >-
      github.actor == vars.RELEASE_MAINTAINER &&
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/release/v5-beta')
    environment: npm-release
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the verified closeout bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-release-evidence-${{ inputs.expected_version }}-${{ inputs.expected_sha256 }}
          path: .artifacts/package

      - name: Create or resume the draft prerelease
        id: release
        run: |
          tag="v${EXPECTED_VERSION}"
          encoded_release=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | @base64" | head -n 1)
          if test -z "$encoded_release"; then
            gh release create "$tag" \
              .artifacts/package/packages/*.tgz \
              .artifacts/package/artifact.json \
              .artifacts/package/candidate.json \
              .artifacts/package/dist-tag-auth-probe-evidence.json \
              .artifacts/package/dist-tag-promotion-evidence.json \
              .artifacts/package/dist-tag-rollback-evidence.json \
              .artifacts/package/publish-plan.json \
              .artifacts/package/provenance-audit.json \
              .artifacts/package/registry-evidence.json \
              --target "$EXPECTED_COMMIT" \
              --verify-tag \
              --draft \
              --prerelease \
              --latest=false \
              --title "$tag" \
              --notes-file docs/release/beta-2-release-notes.md
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release=$(printf '%s' "$encoded_release" | base64 --decode)
          if test "$(printf '%s' "$release" | jq -r .draft)" = "true"; then
            test "$(printf '%s' "$release" | jq -r .target_commitish)" = "$EXPECTED_COMMIT"
            assets=$(printf '%s' "$release" | jq -r '.assets[].name')
            missing=()
            for file in \
              .artifacts/package/packages/*.tgz \
              .artifacts/package/artifact.json \
              .artifacts/package/candidate.json \
              .artifacts/package/dist-tag-auth-probe-evidence.json \
              .artifacts/package/dist-tag-promotion-evidence.json \
              .artifacts/package/dist-tag-rollback-evidence.json \
              .artifacts/package/publish-plan.json \
              .artifacts/package/provenance-audit.json \
              .artifacts/package/registry-evidence.json; do
              if ! printf '%s\n' "$assets" | grep -Fxq "$(basename "$file")"; then
                missing+=("$file")
              fi
            done
            if test "${#missing[@]}" -gt 0; then
              gh release upload "$tag" "${missing[@]}"
            fi
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$(printf '%s' "$release" | jq -r .prerelease)" = "true"
          test "$(printf '%s' "$release" | jq -r .immutable)" = "true"
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")
          tag_sha=$(printf '%s' "$tag_ref" | jq -r .object.sha)
          if test "$(printf '%s' "$tag_ref" | jq -r .object.type)" = "tag"; then
            tag_sha=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
              --jq .object.sha)
          fi
          test "$tag_sha" = "$EXPECTED_COMMIT"
          echo "already_published=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}

      - name: Verify every retained evidence asset byte
        run: |
          tag="v${EXPECTED_VERSION}"
          release=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate \
            --jq ".[] | select(.tag_name == \"$tag\")")
          test -n "$release"
          asset_directory=$(mktemp -d)
          trap 'rm -rf "$asset_directory"' EXIT
          for file in \
            .artifacts/package/packages/*.tgz \
            .artifacts/package/artifact.json \
            .artifacts/package/candidate.json \
            .artifacts/package/dist-tag-auth-probe-evidence.json \
            .artifacts/package/dist-tag-promotion-evidence.json \
            .artifacts/package/dist-tag-rollback-evidence.json \
            .artifacts/package/publish-plan.json \
            .artifacts/package/provenance-audit.json \
            .artifacts/package/registry-evidence.json; do
            name=$(basename "$file")
            asset_id=$(printf '%s' "$release" | \
              jq -r --arg name "$name" \
              '.assets[] | select(.name == $name) | .id' | head -n 1)
            test -n "$asset_id"
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$asset_directory/$name"
            local_sha=$(sha256sum "$file" | cut -d ' ' -f 1)
            remote_sha=$(sha256sum "$asset_directory/$name" | cut -d ' ' -f 1)
            test "$remote_sha" = "$local_sha"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}

      - name: Publish the immutable non-latest prerelease
        if: steps.release.outputs.already_published != 'true'
        run: >-
          gh release edit "v${EXPECTED_VERSION}"
          --draft=false
          --prerelease
          --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}

      - name: Verify the immutable tag, Release, and evidence assets
        run: |
          tag="v${EXPECTED_VERSION}"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          test "$(printf '%s' "$release" | jq -r .draft)" = "false"
          test "$(printf '%s' "$release" | jq -r .prerelease)" = "true"
          test "$(printf '%s' "$release" | jq -r .immutable)" = "true"
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")
          tag_sha=$(printf '%s' "$tag_ref" | jq -r .object.sha)
          if test "$(printf '%s' "$tag_ref" | jq -r .object.type)" = "tag"; then
            tag_sha=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
              --jq .object.sha)
          fi
          test "$tag_sha" = "$EXPECTED_COMMIT"
          assets=$(printf '%s' "$release" | jq -r '.assets[].name')
          for file in \
            .artifacts/package/packages/*.tgz \
            .artifacts/package/artifact.json \
            .artifacts/package/candidate.json \
            .artifacts/package/dist-tag-auth-probe-evidence.json \
            .artifacts/package/dist-tag-promotion-evidence.json \
            .artifacts/package/dist-tag-rollback-evidence.json \
            .artifacts/package/publish-plan.json \
            .artifacts/package/provenance-audit.json \
            .artifacts/package/registry-evidence.json; do
            printf '%s\n' "$assets" | grep -Fx "$(basename "$file")"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
