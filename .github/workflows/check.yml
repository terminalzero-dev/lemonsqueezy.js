name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Use Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Enable the repository package manager
        run: corepack enable

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Record tool versions
        run: pnpm tool:versions

      - name: Run credential-free checks
        run: pnpm check
